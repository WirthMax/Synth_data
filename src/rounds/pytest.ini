[pytest]
# src/__init__.py exists and does `from scene import *` (needs scipy) -- pytest's classic
# import mode, when invoked from src/, walks up to and imports src/__init__.py as part of
# package discovery, which fails under synmodel (no scipy). importlib mode addresses each test
# file by its own path instead, without needing __init__.py-based package machinery anywhere in
# rounds/ (which is deliberately not a package, matching src/'s own convention).
addopts = --import-mode=importlib
